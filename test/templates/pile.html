    <script>
 // ===================== MANUAL REMEDY COUNTS =====================
const remedyManualCounts = {
    "A001": { case1: 476, case23: 1344 },
    "A002": { case1: 92,  case23: 2244 },
    "A003": { case1: 245, case23: 417 },
    "A004": { case1: 627, case23: 4530 },
    "A005": { case1: 20,   case23: 1852 }
};

// ===================== TOTAL PILES PER AREA =====================
const totalPiles = {
    "A001": 3932,
    "A002": 5404,
    "A003": 1932,
    "A004": 7900,
    "A005": 2820
};

let selectedPiles = [];
let legendCounts = {};

// ===================== COLOUR OF TABLES THAT HAVE PENDING PILES =====================
// Change this one value to adjust the shade. Examples:
//   "#000000" = full black      "#333333" = very dark grey
//   "#555555" = light black     "#777777" = lighter grey
//   "rgba(0,0,0,0.5)" = see-through black
const PENDING_TABLE_COLOR = "#555555";

// counts of pending piles per case, filled from /get_pending_piles
let pendingCounts = null;

// counts of piles per case for the "Available for work" view, filled from /get_available_piles (Excel)
let availableCounts = null;

/* -------------------- OPEN IMAGE MAP -------------------- */
function openImageMap() {
    let container = document.getElementById("imageMapContainer");
    let button = document.querySelector(".image-map-btn-custom");

    if (container.style.display === "none" || container.style.display === "") {
        container.style.display = "block";
        button.textContent = "Close Image Map";
    } else {
        container.style.display = "none";
        button.textContent = "Open Image Map";
    }
}

/* -------------------- SELECT PILES -------------------- */
function togglePileValue(value) {
    let pileIndex = selectedPiles.indexOf(value);

    if (pileIndex === -1) {
        selectedPiles.push(value);
    } else {
        selectedPiles.splice(pileIndex, 1);
    }

    updatePileDisplay();
}

/* -------------------- UPDATE SELECTED PILE TAGS -------------------- */
function updatePileDisplay() {
    let pileContainer = document.getElementById("pileContainer");
    pileContainer.innerHTML = "";

    selectedPiles.forEach((pile, index) => {
        let tag = document.createElement("span");
        tag.classList.add("pile-tag");
        tag.innerHTML = `${pile} <span class="remove-x" onclick="removePile(${index})">×</span>`;
        pileContainer.appendChild(tag);
    });

    document.getElementById("table_id").value = selectedPiles.join(", ");
}

/* -------------------- REMOVE PILE -------------------- */
function removePile(index) {
    let removedPile = selectedPiles[index];
    selectedPiles.splice(index, 1);

    let iframe = document.getElementById("imageMapFrame").contentWindow;
    let hotspotElement = iframe.document.querySelector(`[data-name="${removedPile}"]`);

    if (hotspotElement) {
        hotspotElement.classList.remove("selected-hotspot");
    }

    updatePileDisplay();
}

/* -------------------- SELECT ALL TABLES -------------------- */
function toggleAllPiles() {
    let selectAllButton = document.getElementById("select_all_btn");
    let iframe = document.getElementById("imageMapFrame").contentWindow;
    let hotspots = iframe.document.querySelectorAll("[data-name]");

    selectedPiles = [];

    if (selectAllButton.textContent === "Select All Piles") {
        hotspots.forEach(hotspot => {
            let pileName = hotspot.getAttribute("data-name");
            if (!selectedPiles.includes(pileName)) {
                selectedPiles.push(pileName);
                hotspot.classList.add("selected-hotspot");
            }
        });
        selectAllButton.textContent = "Deselect All Piles";
    } else {
        hotspots.forEach(hotspot => {
            hotspot.classList.remove("selected-hotspot");
        });
        selectAllButton.textContent = "Select All Piles";
    }

    updatePileDisplay();
}

/* -------------------- FORM SUBMIT -------------------- */
document.getElementById("pileForm").addEventListener("submit", function (event) {
    event.preventDefault();

    var formData = new FormData(this);

    fetch("/submit_pile_form", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        var popupMessage = document.getElementById("popupMessage");
        popupMessage.textContent = data.message || "Error submitting the form";

        if (data.success) {
            popupMessage.classList.remove("failure");
            popupMessage.classList.add("success");
            setTimeout(function () {
                window.location.href = "dashboard";
            }, 3000);
        } else {
            popupMessage.classList.remove("success");
            popupMessage.classList.add("failure");
        }

        popupMessage.style.display = "block";
        setTimeout(function () {
            popupMessage.style.display = "none";
        }, 3000);
    })
    .catch(error => {
        var popupMessage = document.getElementById("popupMessage");
        popupMessage.classList.add("failure");
        popupMessage.textContent = "Error submitting form";
        popupMessage.style.display = "block";
    });
});

/* -------------------- LOAD AREA DROPDOWN -------------------- */
fetch("/get_area_ids")
.then(response => response.json())
.then(data => {
    const areaSelect = document.getElementById("area_id");

    data.areas.forEach(area => {
        const option = document.createElement("option");
        option.value = area.id;
        option.textContent = area.location;
        areaSelect.appendChild(option);
    });
});

/* -------------------- VIEW TYPE DROPDOWN -------------------- */
function applyViewType(viewType) {
    updateLegend(viewType);

    if (viewType !== "pending" && viewType !== "available") {
        showPendingStatus("");
        setBadgesHidden(false); // bring the number circles back in the other views
    }

    if (viewType === "case") {
        loadCaseData();
    } else if (viewType === "pending") {
        loadPendingPiles();
    } else if (viewType === "available") {
        loadAvailablePiles();
    } else {
        resetCaseView();
    }
}

/* -------------------- HIDE / SHOW THE NUMBER CIRCLES (count badges) ON THE MAP -------------------- */
function setBadgesHidden(hidden) {
    try {
        const doc = document.getElementById("imageMapFrame").contentDocument;
        if (!doc || !doc.head) return;

        let st = doc.getElementById("hideBadgesStyle");

        if (hidden) {
            if (!st) {
                st = doc.createElement("style");
                st.id = "hideBadgesStyle";
                st.textContent = ".count-badge{display:none !important;}";
                doc.head.appendChild(st);
            }
        } else if (st) {
            st.remove();
        }
    } catch (e) {
        console.error("setBadgesHidden failed:", e);
    }
}

/* -------------------- BLACK BACKGROUND STYLE FOR PENDING TABLES (inside the iframe) -------------------- */
function ensurePendingTableStyle(doc) {
    if (doc.getElementById("pendingTableStyle")) return;

    const st = doc.createElement("style");
    st.id = "pendingTableStyle";
    st.textContent = `.pending-table{background:${PENDING_TABLE_COLOR} !important;background-color:${PENDING_TABLE_COLOR} !important;color:#fff !important;}`;
    doc.head.appendChild(st);
}

/* -------------------- ON-PAGE STATUS MESSAGE -------------------- */
function showPendingStatus(msg, isError) {
    let el = document.getElementById("pendingStatus");

    if (!el) {
        el = document.createElement("div");
        el.id = "pendingStatus";
        el.style.cssText = "margin:8px 0;padding:8px 12px;border-radius:4px;font-size:14px;";
        const group = document.getElementById("view_type").closest(".form-group");
        group.insertAdjacentElement("afterend", el);
    }

    el.style.display = msg ? "block" : "none";
    el.textContent = msg || "";
    el.style.background = isError ? "#fdecea" : "#e8f5e9";
    el.style.color = isError ? "#b71c1c" : "#1b5e20";
}

/* -------------------- WAIT UNTIL THE MAP IFRAME HAS HOTSPOTS -------------------- */
function whenMapReady() {
    const iframe = document.getElementById("imageMapFrame");

    const check = () => {
        try {
            const d = iframe.contentDocument;
            return !!(d && d.readyState === "complete" && d.querySelector("[data-name]"));
        } catch (e) {
            return false;
        }
    };

    return new Promise(resolve => {
        if (check()) return resolve(true);

        let tries = 0;
        const timer = setInterval(() => {
            if (check()) {
                clearInterval(timer);
                resolve(true);
            } else if (++tries > 40) { // about 10 seconds
                clearInterval(timer);
                resolve(false);
            }
        }, 250);
    });
}

/* -------------------- MAKE SURE CASE COLOUR CSS EXISTS INSIDE THE IFRAME -------------------- */
function ensureCaseStyles(doc) {
    if (doc.getElementById("caseViewStyles")) return;

    const probe = doc.createElement("div");
    probe.className = "case1";
    doc.body.appendChild(probe);
    const hasStyle = doc.defaultView.getComputedStyle(probe).backgroundColor !== "rgba(0, 0, 0, 0)";
    probe.remove();

    if (hasStyle) return; // the map page already defines these styles

    const st = doc.createElement("style");
    st.id = "caseViewStyles";
    st.textContent = `
        .hotspot-case-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
            width:100%;height:100%;position:absolute;top:0;left:0;pointer-events:none;}
        .case-box{border:1px solid rgba(0,0,0,0.2);}
        .case1{background:red;}
        .case2{background:orange;}
        .case3{background:yellow;}
        .case4{background:green;}
    `;
    doc.head.appendChild(st);
}

document.getElementById("view_type").addEventListener("change", function () {
    applyViewType(this.value);
});

document.addEventListener("DOMContentLoaded", function () {

/* -------------------- LOAD CASE DATA -------------------- */
function loadCaseData() {
    const area = document.getElementById("area_id").value;

    if (!area) {
        alert("Please select area first");
        return;
    }

    fetch(`/get_case_data?area_id=${encodeURIComponent(area)}`)
    .then(res => res.json())
    .then(result => {
        if (result.success) {
            applyCaseColors(result.data);
            applyRemedyBorders(result.remedy_done || []);
        }
    });
}

/* -------------------- LOAD PENDING PILES -------------------- */
async function loadPendingPiles() {
    const area = document.getElementById("area_id").value;

    if (!area) {
        showPendingStatus("Please select an area first.", true);
        return;
    }

    showPendingStatus("Loading pending piles...");

    try {
        // 1. wait until the map iframe has finished loading its hotspots
        const ready = await whenMapReady();
        if (!ready) {
            showPendingStatus("The map did not finish loading, so nothing could be drawn. Try again.", true);
            return;
        }

        // hide the number circles while the pending view is active
        if (document.getElementById("view_type").value === "pending") setBadgesHidden(true);

        // 2. get the data
        const res = await fetch(`/get_pending_piles?area_id=${encodeURIComponent(area)}`);
        if (!res.ok) {
            showPendingStatus(`Server returned ${res.status} for /get_pending_piles. Check the Flask route and the Flask terminal.`, true);
            return;
        }
        const json = await res.json();

        // user may have switched view while we were loading
        if (document.getElementById("view_type").value !== "pending") return;

        const rows = (json.data || []).map(r => ({
            table_id: String(r["Table ID"]),
            pile_no: r["Pile No"],
            assessment_case: r["Assessment Case"]
        }));

        // legend numbers come straight from the backend rows
        pendingCounts = { case1: 0, case2: 0, case3: 0, total: rows.length };
        rows.forEach(x => {
            const k = String(x.assessment_case).toLowerCase().replace(/\s+/g, "");
            if (k === "case1" || k === "case2" || k === "case3") pendingCounts[k]++;
        });
        updateLegend("pending");

        // 3. draw on the map
        resetCaseView();

        if (rows.length === 0) {
            showPendingStatus(`No pending piles found for ${area}.`);
            return;
        }

        const r = applyCaseColors(rows, { blackBackground: true });

        let msg = `Pending piles: ${rows.length} from database, ${r.matched} matched on map, ${r.painted} drawn.`;
        if (r.painted === 0 || r.matched < rows.length) {
            if (r.unmatchedSample) msg += ` Example Table ID not found on map: "${r.unmatchedSample}".`;
            if (r.mapSample) msg += ` Example map name: "${r.mapSample}".`;
            if (r.badPileSample !== null) msg += ` Example Pile No outside 1-4: "${r.badPileSample}".`;
        }
        showPendingStatus(msg, r.painted === 0);

    } catch (err) {
        console.error("Pending load failed:", err);
        showPendingStatus("Failed to load pending piles: " + err.message, true);
    }
}

/* -------------------- LOAD "AVAILABLE FOR WORK" PILES (from the Excel sheet) -------------------- */
async function loadAvailablePiles() {
    const area = document.getElementById("area_id").value;

    if (!area) {
        showPendingStatus("Please select an area first.", true);
        return;
    }

    showPendingStatus("Loading available-for-work piles from the Excel sheet...");

    try {
        const ready = await whenMapReady();
        if (!ready) {
            showPendingStatus("The map did not finish loading, so nothing could be drawn. Try again.", true);
            return;
        }

        // same look as the pending view: no number circles
        if (document.getElementById("view_type").value === "available") setBadgesHidden(true);

        const res = await fetch(`/get_available_piles?area_id=${encodeURIComponent(area)}`);
        const json = await res.json().catch(() => ({}));

        if (!res.ok) {
            showPendingStatus(json.error || `Server returned ${res.status} for /get_available_piles.`, true);
            return;
        }

        // user may have switched view while we were loading
        if (document.getElementById("view_type").value !== "available") return;

        const rows = (json.data || []).map(r => ({
            table_id: String(r["Table ID"]),
            pile_no: r["Pile No"],
            assessment_case: r["Assessment Case"]
        }));

        availableCounts = { case1: 0, case2: 0, case3: 0, total: rows.length };
        rows.forEach(x => {
            const k = String(x.assessment_case).toLowerCase().replace(/\s+/g, "");
            if (k === "case1" || k === "case2" || k === "case3") availableCounts[k]++;
        });
        updateLegend("available");

        resetCaseView();

        if (rows.length === 0) {
            showPendingStatus(`No piles marked "Available for work & Road = YES" for ${area} in the Excel sheet.`);
            return;
        }

        const r = applyCaseColors(rows, { blackBackground: true });

        let msg = `Available for work: ${rows.length} from Excel, ${r.matched} matched on map, ${r.painted} drawn.`;
        if (r.painted === 0 || r.matched < rows.length) {
            if (r.unmatchedSample) msg += ` Example Table ID not found on map: "${r.unmatchedSample}".`;
            if (r.mapSample) msg += ` Example map name: "${r.mapSample}".`;
            if (r.badPileSample !== null) msg += ` Example Pile No outside 1-4: "${r.badPileSample}".`;
        }
        showPendingStatus(msg, r.painted === 0);

    } catch (err) {
        console.error("Available load failed:", err);
        showPendingStatus("Failed to load available piles: " + err.message, true);
    }
}

/* -------------------- APPLY CASE COLORS -------------------- */
function applyCaseColors(caseData, options = {}) {
    let iframe = document.getElementById("imageMapFrame").contentWindow;
    let doc = iframe.document;

    ensureCaseStyles(doc);
    if (options.blackBackground) ensurePendingTableStyle(doc);

    // lookup of every hotspot by normalised name (trimmed, lower case)
    const hotspotMap = {};
    doc.querySelectorAll("[data-name]").forEach(h => {
        hotspotMap[h.getAttribute("data-name").trim().toLowerCase()] = h;
    });

    const result = {
        total: caseData.length,
        matched: 0,
        painted: 0,
        unmatchedSample: null,
        badPileSample: null,
        mapSample: Object.keys(hotspotMap)[0] || null
    };

    caseData.forEach(row => {
        let tableId = String(row.table_id).trim();
        let pileNo = parseInt(row.pile_no);
        let caseName = String(row.assessment_case).trim();

        let hotspot = hotspotMap[tableId.toLowerCase()];
        if (!hotspot) {
            if (!result.unmatchedSample) result.unmatchedSample = tableId;
            return;
        }
        result.matched++;

        // pending view: tables present in the backend data get a black background
        if (options.blackBackground) hotspot.classList.add("pending-table");

        // the overlay grid is absolutely positioned, so the hotspot must be a positioning parent
        if (iframe.getComputedStyle(hotspot).position === "static") {
            hotspot.style.position = "relative";
        }

        /* create grid if not exist */
        let grid = hotspot.querySelector(".hotspot-case-grid");

        if (!grid) {
            grid = doc.createElement("div");
            grid.className = "hotspot-case-grid";

            for (let i = 1; i <= 4; i++) {
                let part = doc.createElement("div");
                part.className = "case-box";
                part.setAttribute("data-pile", i);
                grid.appendChild(part);
            }

            hotspot.appendChild(grid);
        }

        /* find correct pile part */
        let pilePart = grid.querySelector(`[data-pile="${pileNo}"]`);
        if (!pilePart) {
            if (result.badPileSample === null) result.badPileSample = row.pile_no;
            return;
        }

        /* apply color */
        pilePart.classList.remove("case1", "case2", "case3", "case4");

        const caseKey = caseName.toLowerCase().replace(/\s+/g, ""); // "Case 1" -> "case1"
        if (["case1", "case2", "case3", "case4"].includes(caseKey)) {
            pilePart.classList.add(caseKey);
            result.painted++;
        }
    });

    return result;
}

/* -------------------- RESET CASE VIEW -------------------- */
function resetCaseView() {
    let iframe = document.getElementById("imageMapFrame").contentWindow;
    let doc = iframe.document;

    /* remove grids */
    let grids = doc.querySelectorAll(".hotspot-case-grid");
    grids.forEach(g => g.remove());

    /* remove remedy borders */
    let hotspots = doc.querySelectorAll("[data-name]");
    hotspots.forEach(h => {
        h.style.border = "";
        h.classList.remove("remedy-border");
        h.classList.remove("pending-table");
    });
}

/* -------------------- REMEDY BORDERS -------------------- */
function applyRemedyBorders(remedyData) {
    let iframe = document.getElementById("imageMapFrame").contentWindow;
    let doc = iframe.document;

    let allHotspots = doc.querySelectorAll("[data-name]");
    allHotspots.forEach(h => {
        h.classList.remove("remedy-border");
    });

    remedyData.forEach(row => {
        let tableId = row.table_id.trim();
        let hotspot = doc.querySelector(`[data-name="${tableId}"]`);
        if (!hotspot) return;
        hotspot.classList.add("remedy-border");
    });
}

// ===================== AREA CHANGE =====================
document.getElementById("area_id").addEventListener("change", function () {
    const selectedValue = this.value.trim();
    const iframe = document.getElementById("imageMapFrame");

    if (selectedValue) {
        const hotspotURL = `/${selectedValue}remedyhotspot`;

        pendingCounts = null;   // old area's numbers must not be shown for the new area
        availableCounts = null;

        // set onload BEFORE changing src so the current view is re-applied once the map is ready
        iframe.onload = function () {
            const vt = document.getElementById("view_type").value;
            if (vt === "case") loadCaseData();
            else if (vt === "pending") loadPendingPiles();
            else if (vt === "available") loadAvailablePiles();
        };

        iframe.src = hotspotURL;

        document.getElementById("imageMapContainer").style.display = "block";

        // FETCH LEGEND COUNT
        fetch("/get-legend-count", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ area: selectedValue })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                legendCounts = data;
                updateLegend(document.getElementById("view_type").value);
            }
        });
    }
});

// ===================== PDF DOWNLOAD =====================
async function downloadHotspotPDF() {
    try {
        const iframe = document.getElementById("imageMapFrame");
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

        const mapContainer = iframeDoc.querySelector(".container");
        const legendContainer = document.getElementById("legendContainer");

        if (!mapContainer) {
            alert("Map not loaded");
            return;
        }

        // Load html2canvas
        if (typeof html2canvas === "undefined") {
            await new Promise(resolve => {
                const script = document.createElement("script");
                script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
                script.onload = resolve;
                document.head.appendChild(script);
            });
        }

        // PREPARE CIRCLES FOR PDF RENDERING
        const hotspots = iframeDoc.querySelectorAll(".hotspot");

        hotspots.forEach(h => {
            let badge = h.querySelector(".count-badge");

            if (badge) {
                badge.dataset.oldStyle = badge.getAttribute("style") || "";

                badge.style.width = "5px";
                badge.style.height = "5px";
                badge.style.fontSize = "5px";
                badge.style.display = "block";
                badge.style.textAlign = "center";
                badge.style.lineHeight = "5px";
                badge.style.borderRadius = "50%";
                badge.style.background = "red";
                badge.style.color = "white";
                badge.style.position = "absolute";
                badge.style.top = "50%";
                badge.style.left = "50%";
                badge.style.transform = "translate(-50%, -50%)";
            }
        });

        // CAPTURE MAP
        const mapCanvas = await html2canvas(mapContainer, {
            useCORS: true,
            allowTaint: true,
            scale: 2
        });

        const mapImg = mapCanvas.toDataURL("image/png");

        // RESTORE ORIGINAL UI
        hotspots.forEach(h => {
            let badge = h.querySelector(".count-badge");
            if (badge && badge.dataset.oldStyle !== undefined) {
                badge.setAttribute("style", badge.dataset.oldStyle);
            }
        });

        // CAPTURE LEGENDS
        const legendBoxes = legendContainer.querySelectorAll(".legend-box");

        if (legendBoxes.length < 2) {
            alert("Legend boxes not found");
            return;
        }

        const box1Canvas = await html2canvas(legendBoxes[0], { backgroundColor: "#fff", scale: 2 });
        const box2Canvas = await html2canvas(legendBoxes[1], { backgroundColor: "#fff", scale: 2 });

        const box1Img = box1Canvas.toDataURL("image/png");
        const box2Img = box2Canvas.toDataURL("image/png");

        // CREATE PDF
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("landscape", "mm", "a4");

        let pageWidth = pdf.internal.pageSize.getWidth();
        let pageHeight = pdf.internal.pageSize.getHeight();

        // HEADER
        let areaSelect = document.getElementById("area_id");
        let areaName = "";

        if (areaSelect.selectedIndex > 0) {
            areaName = areaSelect.options[areaSelect.selectedIndex].text.trim();
        }

        let today = new Date().toLocaleDateString("en-GB");

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(16);
        pdf.text(areaName, 10, 12);

        let rightText = `Report date :- ${today}`;
        let rightTextWidth = pdf.getTextWidth(rightText);
        pdf.text(rightText, pageWidth - rightTextWidth - 10, 12);

        // MAP
        let mapWidth = 280;
        let mapHeight = (mapCanvas.height * mapWidth) / mapCanvas.width;
        pdf.addImage(mapImg, "PNG", 10, 20, mapWidth, mapHeight);

        // LEGEND SIDE BY SIDE
        let boxWidth = 100;
        let box1Height = (box1Canvas.height * boxWidth) / box1Canvas.width;
        let box2Height = (box2Canvas.height * boxWidth) / box2Canvas.width;
        let maxHeight = Math.max(box1Height, box2Height);

        let leftX = 20;
        let rightX = pageWidth - boxWidth - 20;
        let posY = pageHeight - maxHeight - 3;

        pdf.addImage(box1Img, "PNG", leftX, posY, boxWidth, box1Height);
        pdf.addImage(box2Img, "PNG", rightX, posY, boxWidth, box2Height);

        // FOOTER
        let footerText = "INDISOLAR - Software generated report";

        pdf.setFont("helvetica", "italic");
        pdf.setFontSize(10);
        pdf.setTextColor(0, 102, 204);

        let footerWidth = pdf.getTextWidth(footerText);
        pdf.text(footerText, pageWidth - footerWidth - 40, pageHeight - 3);

        pdf.setTextColor(0, 0, 0);

        // SAVE
        let cleanAreaName = areaName.replace(/\s+/g, "_").replace(/[^\w\-]/g, "");
        let fileName = `${cleanAreaName}_hotspotmap.pdf`;
        pdf.save(fileName);

    } catch (err) {
        console.error(err);
        alert("PDF generation failed");
    }
}

// ===================== PENDING VIEW LEGEND =====================
function buildPendingLegend(legend, mode) {
    const isAvailable = mode === "available";
    const c = (isAvailable ? availableCounts : pendingCounts) || { case1: "...", case2: "...", case3: "...", total: "..." };

    const makeItem = (color, label, fullWidth) => {
        const item = document.createElement("div");
        item.className = "legend-item";
        if (fullWidth) item.style.width = "100%";

        const box = document.createElement("div");
        box.className = "legend-color";
        box.style.background = color;

        const text = document.createElement("span");
        text.textContent = label;

        item.appendChild(box);
        item.appendChild(text);
        return item;
    };

    // BOX 1 -> PENDING PILES (counts from the backend)
    const box1 = document.createElement("div");
    box1.className = "legend-box";

    const title1 = document.createElement("div");
    title1.className = "legend-title";
    title1.textContent = isAvailable
        ? `Available for work (Total: ${c.total})`
        : `Pending Piles (Total: ${c.total})`;
    box1.appendChild(title1);

    box1.appendChild(makeItem("red", `Case1 [${c.case1}]`));
    box1.appendChild(makeItem("orange", `Case2 [${c.case2}]`));
    box1.appendChild(makeItem("yellow", `Case3 [${c.case3}]`));

    legend.appendChild(box1);

    // BOX 2 -> COLOUR NOTATION
    const box2 = document.createElement("div");
    box2.className = "legend-box";

    const title2 = document.createElement("div");
    title2.className = "legend-title";
    title2.textContent = "Colour Notation";
    box2.appendChild(title2);

    if (isAvailable) {
        box2.appendChild(makeItem(PENDING_TABLE_COLOR, "Available for work & Road", true));
    } else {
        box2.appendChild(makeItem("rgba(0,255,0,0.5)", "Assessment done & Remedy done", true));
        box2.appendChild(makeItem(PENDING_TABLE_COLOR, "Remedy pending", true));
    }

    legend.appendChild(box2);
}

// ===================== LEGEND UPDATE =====================
function updateLegend(viewType) {
    let selectedArea = document.getElementById("area_id").value.trim();
    let total = totalPiles[selectedArea] || 0;

    let legend = document.getElementById("legendContainer");
    legend.innerHTML = "";

    if (viewType === "pending" || viewType === "available") {
        buildPendingLegend(legend, viewType);
        return;
    }

    // ============================
    // BOX 1 -> ASSESSMENT SUMMARY
    // ============================
    let box1 = document.createElement("div");
    box1.className = "legend-box";

    let title1 = document.createElement("div");
    title1.className = "legend-title";
    title1.textContent = `Assessment Summary (Total Piles: ${total})`;
    box1.appendChild(title1);

    let cases = [
        { name: "Case1", color: "red" },
        { name: "Case2", color: "orange" },
        { name: "Case3", color: "yellow" },
        { name: "Case4", color: "green" },
    ];

    cases.forEach(c => {
        let item = document.createElement("div");
        item.className = "legend-item";

        let box = document.createElement("div");
        box.className = "legend-color";
        box.style.background = c.color;

        let text = document.createElement("span");
        let count = legendCounts[c.name.toLowerCase()] || 0;
        text.textContent = `${c.name} [${count}]`;

        item.appendChild(box);
        item.appendChild(text);
        box1.appendChild(item);
    });

    let c1 = parseInt(legendCounts["case1"] || 0);
    let c2 = parseInt(legendCounts["case2"] || 0);
    let c3 = parseInt(legendCounts["case3"] || 0);
    let c4 = parseInt(legendCounts["case4"] || 0);

    let assessedTotal = c1 + c2 + c3 + c4;
    let notExcavated = total - assessedTotal;
    if (notExcavated < 0) notExcavated = 0;

    let normal1 = [
        { name: `Assessment done [${assessedTotal}]`, color: "rgba(0,0,255,0.5)" },
        { name: `Not Excavated [${notExcavated}]`, color: "rgba(135, 206, 250, 0.2)" }
    ];

    normal1.forEach(n => {
        let item = document.createElement("div");
        item.className = "legend-item";

        let box = document.createElement("div");
        box.className = "legend-color";
        box.style.background = n.color;

        let text = document.createElement("span");
        text.textContent = n.name;

        item.appendChild(box);
        item.appendChild(text);
        box1.appendChild(item);
    });

    legend.appendChild(box1);

    // ============================
    // BOX 2 -> REMEDY INFO
    // ============================
    let box2 = document.createElement("div");
    box2.className = "legend-box";

    let title2 = document.createElement("div");
    title2.className = "legend-title";
    title2.textContent = "Remedy Summary";
    box2.appendChild(title2);

    let remedyCases = [
        { name: "Case1", color: "red", key: "remedy_case1" },
        { name: "Case2 & Case3", color: "orange", key: "case23" }
    ];

    let manualData = remedyManualCounts[selectedArea];

    remedyCases.forEach(c => {
        let item = document.createElement("div");
        item.className = "legend-item";

        let box = document.createElement("div");
        box.className = "legend-color";
        box.style.background = c.color;

        let text = document.createElement("span");
        let count = 0;

        if (manualData) {
            if (c.key === "case23") {
                count = manualData.case23 || 0;
            } else if (c.key === "remedy_case1") {
                count = manualData.case1 || 0;
            }
        } else {
            if (c.key === "case23") {
                count =
                    parseInt(legendCounts["remedy_case2"] || 0) +
                    parseInt(legendCounts["remedy_case3"] || 0);
            } else {
                count = legendCounts[c.key] || 0;
            }
        }

        text.textContent = `${c.name} [${count}]`;

        item.appendChild(box);
        item.appendChild(text);
        box2.appendChild(item);
    });

    // Remedy done (green)
    let remedyItem = document.createElement("div");
    remedyItem.className = "legend-item";

    let remedyBox = document.createElement("div");
    remedyBox.className = "legend-color";
    remedyBox.style.background = "rgba(0,255,0,0.5)";

    let remedyText = document.createElement("span");
    remedyText.textContent = "Remedy done";

    remedyItem.appendChild(remedyBox);
    remedyItem.appendChild(remedyText);
    box2.appendChild(remedyItem);

    // Circle with fixed number (1)
    let circleItem = document.createElement("div");
    circleItem.className = "legend-item";

    let circle = document.createElement("div");
    circle.style.width = "14px";
    circle.style.height = "14px";
    circle.style.borderRadius = "50%";
    circle.style.background = "red";
    circle.style.color = "white";
    circle.style.textAlign = "center";
    circle.style.lineHeight = "14px";
    circle.style.fontSize = "8px";
    circle.style.border = "1px solid white";
    circle.innerText = "1";

    let circleText = document.createElement("span");
    circleText.textContent = "Remedy Count";

    circleItem.appendChild(circle);
    circleItem.appendChild(circleText);
    if (viewType !== "pending" && viewType !== "available") box2.appendChild(circleItem); // no "Remedy Count" circle in these views

    legend.appendChild(box2);
}
